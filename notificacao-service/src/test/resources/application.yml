# Perfil de teste: H2 em modo PostgreSQL rodando as mesmas migracoes Flyway de producao.
spring:
  datasource:
    url: jdbc:h2:mem:notificacao;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    listener:
      simple:
        # Sem broker nos testes: o listener nao sobe.
        auto-startup: false

app:
  notificacao:
    remetente: nao-responda@hospital.com
    # Cron que nunca dispara sozinho durante os testes (29 de fevereiro as 03:00).
    cron-lembretes: "0 0 3 29 2 *"

logging:
  level:
    org.springframework.amqp: OFF
