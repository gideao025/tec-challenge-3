spring:
  application:
    name: notificacao-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:notificacao}
    username: ${DB_USER:notificacao}
    password: ${DB_PASSWORD:notificacao}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Sem reenfileirar o que ja falhou: mensagem rejeitada vai para a DLQ,
        # em vez de girar em loop infinito bloqueando a fila.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Mailhog nao exige autenticacao nem TLS.
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8081}

app:
  notificacao:
    remetente: ${MAIL_REMETENTE:nao-responda@hospital.com}
    # Todo dia as 08:00 (America/Sao_Paulo). Sobrescreva para demonstrar o job.
    cron-lembretes: ${CRON_LEMBRETES:0 0 8 * * *}

logging:
  level:
    br.com.fiap.notificacao: INFO
